# capsule profile: sill/prism. prism is a REGULAR (non-LSUIElement) app,
# so it exercises sill's `hidesOnDeactivate = activationPolicy() !=
# .accessory` branch and proves the t-cp90 fix doesn't regress
# regular-app menus.
#
# STATUS: WIP skeleton — prism is not cloned locally, and this is the
# profile that will first exercise `patched-deps` (implemented in
# verify.sh, never yet run). Key names track profiles/wand.toml, which
# is the worked example.

name = "sill-prism"
repos = ["akira-toriyama/prism", "akira-toriyama/sill"]

# prism must be cloned (absent locally); it builds against a patched
# local sill carrying the t-cp90 hidesOnDeactivate one-liner.
worktree = "/Volumes/workspace/github.com/akira-toriyama/prism"
branch = "main"

# A clone capsule owns, detached at the commit under test — NOT the app
# repo's live checkout, which belongs to whatever session has it open
# (see docs/design.md §patched-deps). Populate before the first run:
#   git clone --no-checkout /Volumes/workspace/github.com/akira-toriyama/sill \
#     ~/.tart/capsule-deps/sill && git -C ~/.tart/capsule-deps/sill checkout --detach <rev>
patched-deps = ["sill=~/.tart/capsule-deps/sill"]

# Regular app → no persistent cert / event tap (those are wand's, for
# the AX grant its CGEventTap needs).
# TODO: confirm prism's bundle name and packaging entry point once it is
# cloned.
signing = ""
build = "./package.sh"
app = "Prism.app"

# TODO: fixture with theme='terminal' + a ThemedMenu widget; confirm
# prism's config path.
fixture = "fixtures/prism-menu.toml"
fixture-dest = ".config/prism/config.toml"
launch-env = []

verify-tier = "screenshot"

# TODO
driver = "drivers/prism-render.sh"
