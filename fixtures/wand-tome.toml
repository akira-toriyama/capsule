# capsule gate fixture — wand tome acceptance.
#
# A COMPLETE, self-contained wand config: [failsafe] is mandatory (wand
# refuses to start without it), [tome] is enabled with the "neon" theme,
# and the items give the panel three unmistakable rows to assert — two
# root-level items (Alpha / Beta) and a "Sort" folder, so the AX read
# covers a nested row as well as flat ones. apps = ["*"] so items show
# regardless of the frontmost app, keeping the VM gate
# target-independent and deterministic. Actions are harmless `echo`s —
# the gate reads the panel, not action side effects.

[failsafe]
mouse-hold-timeout-seconds = 30
emergency-release-key = "esc"

[tome]
enabled = true
theme = "neon"

[[tome.cursor.item]]
name = "Alpha"
icon = "SF:a.circle"
apps = ["*"]
action-type = "shell"
action-cmd = "echo alpha"

[[tome.cursor.item]]
name = "Beta"
icon = "SF:b.circle"
apps = ["*"]
action-type = "shell"
action-cmd = "echo beta"

# Folder "Sort" with two children (group path = ["Sort"]) — the nested
# row the driver asserts on.
[[tome.cursor.item]]
name = "By Name"
group = ["Sort"]
apps = ["*"]
action-type = "shell"
action-cmd = "echo name"

[[tome.cursor.item]]
name = "By Date"
group = ["Sort"]
apps = ["*"]
action-type = "shell"
action-cmd = "echo date"
